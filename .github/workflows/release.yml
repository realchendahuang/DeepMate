name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # macos-13 is retired; macos-15-intel is the Intel x86_64 runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The desktop app (Tauri) needs the system webkit/GTK dev packages on
      # Linux; tray-icon pulls in AppIndicator on top.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # The frontend bundle is embedded into the desktop binary at compile
      # time, so it must exist before the src-tauri build.
      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Build CLI
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      # src-tauri is intentionally outside the root workspace (it has its own
      # Node-based build), so the desktop binary is built separately. It has
      # no target-dir of its own, so CARGO_TARGET_DIR points at the root
      # target/ — that is where the packaging steps expect
      # target/<triple>/release/deepmate-desktop.
      - name: Build desktop (Tauri)
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: apps/desktop/src-tauri
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="deepmate-${version}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/deepmate" "${staging}/"
          cp "target/${{ matrix.target }}/release/deepmate-desktop" "${staging}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${staging}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash scripts/package-macos.sh "${version}" "${{ matrix.target }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "deepmate-$version-${{ matrix.target }}"
          $staging = "dist/$name"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/deepmate.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/deepmate-desktop.exe" $staging
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $staging
          Compress-Archive -Path $staging -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          # LF-only checksum file so `sha256sum -c` works for Unix consumers.
          [IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")

      # Extract this version's section from CHANGELOG.md as the release body,
      # so the GitHub release carries the curated changelog instead of
      # auto-generated "Full Changelog" boilerplate. Fails loudly if the
      # version is missing from the changelog (so a release is never published
      # with an empty body).
      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          marker="## [$version]"
          mkdir -p dist
          awk -v marker="$marker" '
            index($0, marker) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md

      # The file patterns are per-OS: with fail_on_unmatched_files each
      # pattern must match, and a single job only ever produces one archive
      # family. The body is the same curated changelog section for every job,
      # so concurrent publishes overwrite it identically (no duplication).
      - name: Publish GitHub release (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha256
          body_path: dist/release-notes.md
          # Tags containing a suffix (v0.2.0-rc.1) publish as prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Publish GitHub release (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.dmg.sha256
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha256
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Publish GitHub release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.zip
            dist/**/*.zip.sha256
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
