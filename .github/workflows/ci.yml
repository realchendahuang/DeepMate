name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The workspace includes the Tauri desktop shell, which needs system
      # webkit/GTK/AppIndicator development packages on Linux.
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # --no-fail-fast: report every failing test binary in one run instead
        # of stopping at the first, which keeps platform-specific breakage
        # visible without a debugging cycle per failure.
        run: cargo test --workspace --locked --no-fail-fast

      # Architectural gate: the control core stays a pure data layer.
      # Harness-specific names live in crates/deepseek-harness, never in the core.
      - name: Core purity gate
        shell: bash
        run: |
          if grep -rEI 'deepseek|dsh' crates/deepmate-core/src crates/deepmate-core/Cargo.toml; then
            echo "::error::deepmate-core must not reference harness-specific names (deepseek/dsh)"
            exit 1
          fi

  desktop:
    name: desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Tauri needs system webkit/GTK dev packages on Linux.
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Lint and test frontend
        run: npm run check
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Check Tauri Rust
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
