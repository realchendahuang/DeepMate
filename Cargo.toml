[workspace]
resolver = "2"
members = [
    "crates/deepmate-core",
    "crates/deepmate-platform",
    "crates/deepmate-app",
    "crates/deepseek-harness",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[profile.dev]
# Keep backtraces readable (line numbers) while dropping full type debuginfo,
# which is the single biggest contributor to target/debug bloat.
debug = "line-tables-only"

[profile.dev.package."*"]
# Third-party dependencies are by far the bulk of target/debug; their
# debuginfo buys nothing when reading backtraces of our own code.
debug = false

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/realchendahuang/DeepMate"
description = "A lightweight companion and control plane for AI harnesses, starting with DeepSeek Harness."

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
noyalib = { version = "0.0", features = ["compat-serde-yaml"] }
semver = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tar = "0.4"
flate2 = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
