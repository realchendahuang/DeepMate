[workspace]
resolver = "2"
members = [
    "crates/deepmate-core",
    "crates/deepmate-platform",
    "crates/deepmate-app",
    "crates/adapters/deepseek-harness",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/realchendahuang/DeepMate"
description = "A lightweight companion and control plane for AI harnesses, starting with DeepSeek Harness."

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
