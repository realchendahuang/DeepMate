[package]
name = "deepmate-desktop"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/realchendahuang/DeepMate"
description = "DeepMate desktop control center (Tauri)"

# This crate is intentionally outside the root workspace: it has its own
# Node-based build (Tauri + Vite) and must not be part of `cargo build
# --workspace` / CI's core gate.
[workspace]

[lib]
name = "deepmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1"
deepmate-core = { path = "../../../crates/deepmate-core" }
deepmate-platform = { path = "../../../crates/deepmate-platform" }
deepmate-app = { path = "../../../crates/deepmate-app" }
deepseek-harness = { path = "../../../crates/adapters/deepseek-harness" }
