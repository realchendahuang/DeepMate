[package]
name = "deepmate-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DeepMate desktop control center (Tauri)"

# Part of the root workspace (single Cargo.lock, single target dir). The app
# version lives in the root `[workspace.package]`; tauri.conf.json omits its
# own `version`, so the bundle falls back to this Cargo.toml version.

[lib]
name = "deepmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "specta"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
deepmate-core = { path = "../../../crates/deepmate-core" }
deepmate-platform = { path = "../../../crates/deepmate-platform" }
deepmate-app = { path = "../../../crates/deepmate-app" }
deepseek-harness = { path = "../../../crates/deepseek-harness" }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
