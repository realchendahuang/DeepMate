[package]
name = "deepmate-desktop"
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/realchendahuang/DeepMate"
description = "DeepMate desktop control center (Tauri)"

# Part of the root workspace now (single Cargo.lock, single target dir).

[lib]
name = "deepmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "specta"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
deepmate-core = { path = "../../../crates/deepmate-core" }
deepmate-platform = { path = "../../../crates/deepmate-platform" }
deepmate-app = { path = "../../../crates/deepmate-app" }
deepseek-harness = { path = "../../../crates/deepseek-harness" }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
